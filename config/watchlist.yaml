# Watchlist do Radar de Preço Justo.
# Este arquivo PODE ir para o GitHub: só tem tickers e faixas-alvo, nenhum saldo.
#
# zone_min / zone_max: faixa de entrada que você (ou um terceiro) propôs.
# fair_value: preço justo estimado por você (Fase 2 calcula automaticamente).
# source: de onde veio a tese — o Audit Mode registra isso.
# Deixe null quando ainda não definiu.

strategy:
  core_target_pct: [80, 90]        # Núcleo de Preservação
  satellite_max_pct: 20            # Teto do Satélite (ações + cripto)
  single_position_max_pct: 5       # Teto por ativo satélite, % do patrimônio total
  crypto_max_pct: 5                # Teto de BTC+ETH somados
  margin_of_safety_pct: 20         # Desconto mínimo sobre o preço justo p/ "Forte Compra"

